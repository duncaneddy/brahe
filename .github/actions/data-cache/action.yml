name: Brahe data cache
description: >-
    Restore or save the per-family brahe data caches. Families are keyed from
    .github/brahe-data-manifest.txt so a manifest edit rolls every key. A
    restore that only matched an older key counts as a miss so the caller warms
    the new entries and saves them. Runs on main save under the family key;
    runs on any other ref save under a run-suffixed key, which later runs of
    the same ref find by prefix and which never blocks main's key.
inputs:
    families:
        description: >-
            Space-separated families to act on: naif, icgem, sbdb-horizons,
            star-catalogs.
        required: true
    mode:
        description: "`restore` (default) or `save`."
        required: false
        default: restore
outputs:
    missed:
        description: Space-separated families that had no usable cache (restore mode).
        value: ${{ steps.missed.outputs.families }}
    warm-args:
        description: "`scripts/warm_data_cache.py --only` flags covering the missed families."
        value: ${{ steps.missed.outputs.warm_args }}
runs:
    using: composite
    steps:
        -   name: Derive cache keys
            id: keys
            shell: bash
            env:
                MANIFEST_HASH: ${{ hashFiles('.github/brahe-data-manifest.txt') }}
            run: |
                if [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$GITHUB_REF" = "refs/heads/dev" ]; then
                    SUFFIX=""
                else
                    SUFFIX="-run-$GITHUB_RUN_ID"
                fi
                {
                    echo "naif=naif-kernels-v1-$MANIFEST_HASH"
                    echo "icgem=brahe-icgem-v1-$MANIFEST_HASH"
                    echo "sbdb_horizons=brahe-sbdb-horizons-v1-$MANIFEST_HASH"
                    echo "star_catalogs=star-catalogs-v1"
                    echo "suffix=$SUFFIX"
                } >> "$GITHUB_OUTPUT"
        -   name: Restore NAIF kernels
            id: naif
            if: inputs.mode == 'restore' && contains(inputs.families, 'naif')
            uses: actions/cache/restore@v6.1.0
            with:
                path: ~/.cache/brahe/naif
                key: ${{ steps.keys.outputs.naif }}
                restore-keys: |
                    naif-kernels-v1-
        -   name: Restore ICGEM models
            id: icgem
            if: inputs.mode == 'restore' && contains(inputs.families, 'icgem')
            uses: actions/cache/restore@v6.1.0
            with:
                path: ~/.cache/brahe/icgem
                key: ${{ steps.keys.outputs.icgem }}
                restore-keys: |
                    brahe-icgem-v1-
        -   name: Restore SBDB + Horizons
            id: sbdb-horizons
            if: inputs.mode == 'restore' && contains(inputs.families, 'sbdb-horizons')
            uses: actions/cache/restore@v6.1.0
            with:
                path: |
                    ~/.cache/brahe/sbdb
                    ~/.cache/brahe/horizons
                key: ${{ steps.keys.outputs.sbdb_horizons }}
                restore-keys: |
                    brahe-sbdb-horizons-v1-
        -   name: Restore star catalogs
            id: star-catalogs
            if: inputs.mode == 'restore' && contains(inputs.families, 'star-catalogs')
            uses: actions/cache/restore@v6.1.0
            with:
                path: |
                    ~/.cache/brahe/star_catalogs/FK5_Catalog.txt
                    ~/.cache/brahe/star_catalogs/Hipparcos_Catalog.txt
                key: ${{ steps.keys.outputs.star_catalogs }}
                restore-keys: |
                    star-catalogs-v1
        -   name: Record missed families
            id: missed
            if: inputs.mode == 'restore'
            shell: bash
            env:
                FAMILIES: ${{ inputs.families }}
                NAIF_KEY: ${{ steps.keys.outputs.naif }}
                NAIF_MATCHED: ${{ steps.naif.outputs.cache-matched-key }}
                ICGEM_KEY: ${{ steps.keys.outputs.icgem }}
                ICGEM_MATCHED: ${{ steps.icgem.outputs.cache-matched-key }}
                SBDB_HORIZONS_KEY: ${{ steps.keys.outputs.sbdb_horizons }}
                SBDB_HORIZONS_MATCHED: ${{ steps.sbdb-horizons.outputs.cache-matched-key }}
                STAR_CATALOGS_KEY: ${{ steps.keys.outputs.star_catalogs }}
                STAR_CATALOGS_MATCHED: ${{ steps.star-catalogs.outputs.cache-matched-key }}
            run: |
                has() { case " $FAMILIES " in *" $1 "*) return 0 ;; *) return 1 ;; esac; }
                # A match is usable when its key is the family key itself or that
                # key plus a run suffix; an older manifest's key is a miss.
                usable() { case "$2" in "$1"|"$1"-run-*) return 0 ;; *) return 1 ;; esac; }
                missed=""
                args=""
                if has naif && ! usable "$NAIF_KEY" "$NAIF_MATCHED"; then missed="$missed naif"; args="$args --only kernel"; fi
                if has icgem && ! usable "$ICGEM_KEY" "$ICGEM_MATCHED"; then missed="$missed icgem"; args="$args --only icgem"; fi
                if has sbdb-horizons && ! usable "$SBDB_HORIZONS_KEY" "$SBDB_HORIZONS_MATCHED"; then missed="$missed sbdb-horizons"; args="$args --only horizons"; fi
                if has star-catalogs && ! usable "$STAR_CATALOGS_KEY" "$STAR_CATALOGS_MATCHED"; then missed="$missed star-catalogs"; fi
                missed="${missed# }"
                args="${args# }"
                echo "families=$missed" >> "$GITHUB_OUTPUT"
                echo "warm_args=$args" >> "$GITHUB_OUTPUT"
                echo "requested: $FAMILIES"
                echo "missed:    ${missed:-none}"
        -   name: Save NAIF kernels
            if: inputs.mode == 'save' && contains(inputs.families, 'naif')
            uses: actions/cache/save@v6.1.0
            with:
                path: ~/.cache/brahe/naif
                key: ${{ steps.keys.outputs.naif }}${{ steps.keys.outputs.suffix }}
        -   name: Save ICGEM models
            if: inputs.mode == 'save' && contains(inputs.families, 'icgem')
            uses: actions/cache/save@v6.1.0
            with:
                path: ~/.cache/brahe/icgem
                key: ${{ steps.keys.outputs.icgem }}${{ steps.keys.outputs.suffix }}
        -   name: Save SBDB + Horizons
            if: inputs.mode == 'save' && contains(inputs.families, 'sbdb-horizons')
            uses: actions/cache/save@v6.1.0
            with:
                path: |
                    ~/.cache/brahe/sbdb
                    ~/.cache/brahe/horizons
                key: ${{ steps.keys.outputs.sbdb_horizons }}${{ steps.keys.outputs.suffix }}
        -   name: Save star catalogs
            if: inputs.mode == 'save' && contains(inputs.families, 'star-catalogs')
            uses: actions/cache/save@v6.1.0
            with:
                path: |
                    ~/.cache/brahe/star_catalogs/FK5_Catalog.txt
                    ~/.cache/brahe/star_catalogs/Hipparcos_Catalog.txt
                key: ${{ steps.keys.outputs.star_catalogs }}${{ steps.keys.outputs.suffix }}
