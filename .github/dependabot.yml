# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      # rand_distr 0.6 needs rand 0.10, whose StdRng does not implement Clone
      # (SimpleSSNSensor relies on it), and rv requires rand 0.9 /
      # rand_distr 0.5.
      - dependency-name: "rand"
      - dependency-name: "rand_distr"
      - dependency-name: "rv"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

