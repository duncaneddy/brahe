name: Test Rust
on:
    workflow_call:
        inputs:
            network_mode:
                description: "BRAHE_NETWORK_MODE for the test steps once every cache family is warm."
                type: string
                default: "offline"
jobs:
    test-rust:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                # os: [ubuntu-latest]
                os: [ubuntu-latest, macos-latest, windows-latest]
                rust-toolchain: [stable]
        permissions:
            id-token: write
        env:
            CARGO_TERM_COLOR: always
        steps:
            -   uses: actions/checkout@v7.0.1
            # Cargo cache scheme: this job runs from both pr_tests.yml (PRs) and
            # unit_tests.yml (push to main). Give it a stable shared-key so PRs
            # restore main's cache regardless of matrix/job-name hashing, and
            # only let main saves refresh it — PR-scoped saves are unrestorable
            # by any other run (GitHub cache isolation) and just churn quota.
            -   name: Set up Rust toolchain with cache
                uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
                with:
                    toolchain: ${{ matrix.rust-toolchain }}
                    cache-shared-key: test-rust
                    cache-save-if: ${{ github.ref == 'refs/heads/main' }}
            -   name: Set default Rust toolchain
                run: |
                    rustup update ${{ matrix.rust-toolchain }}
                    rustup default ${{ matrix.rust-toolchain }}
            -   name: Install cargo-llvm-cov
                uses: taiki-e/install-action@cargo-llvm-cov
            -   name: Restore NAIF kernels cache
                id: naif-cache
                uses: actions/cache/restore@v6.1.0
                with:
                    path: ~/.cache/brahe/naif
                    key: naif-kernels-v1
            -   name: Seed DE440s test asset into the NAIF cache
                shell: bash
                run: |
                    mkdir -p ~/.cache/brahe/naif
                    cp test_assets/de440s.bsp ~/.cache/brahe/naif/
            -   name: Restore ICGEM cache
                id: icgem-cache
                uses: actions/cache/restore@v6.1.0
                with:
                    path: ~/.cache/brahe/icgem
                    key: brahe-icgem-v1
            -   name: Restore SBDB + Horizons cache
                id: sbdb-horizons-cache
                uses: actions/cache/restore@v6.1.0
                with:
                    path: |
                        ~/.cache/brahe/sbdb
                        ~/.cache/brahe/horizons
                    key: brahe-sbdb-horizons-v1
            -   name: Restore star catalog downloads
                id: star-catalogs-cache
                uses: actions/cache/restore@v6.1.0
                with:
                    path: |
                        ~/.cache/brahe/star_catalogs/FK5_Catalog.txt
                        ~/.cache/brahe/star_catalogs/Hipparcos_Catalog.txt
                    key: star-catalogs-v1
            # This job has no Python environment to run the warm script, so it
            # is offline only when every restored cache family (NAIF, ICGEM,
            # SBDB + Horizons, star catalogs) was an exact hit; otherwise it
            # downloads the kernels once.
            -   name: Run Rust tests with coverage
                # Limit rust-unit coverage to the core `brahe` crate. The `brahe-py`
                # workspace member has no Rust unit tests (it's exercised by pytest),
                # so its coverage is measured in the python-rust combined flag below.
                env:
                    BRAHE_NETWORK_MODE: ${{ steps.naif-cache.outputs.cache-hit == 'true' && steps.icgem-cache.outputs.cache-hit == 'true' && steps.sbdb-horizons-cache.outputs.cache-hit == 'true' && steps.star-catalogs-cache.outputs.cache-hit == 'true' && inputs.network_mode || 'online' }}
                run: cargo llvm-cov -p brahe --lcov --output-path lcov.info
            -   name: Upload coverage to Codecov
                if: matrix.os == 'ubuntu-latest'
                uses: codecov/codecov-action@v7.0.0
                env:
                    CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
                with:
                    files: lcov.info
                    flags: rust-unit
                    fail_ci_if_error: false
                    verbose: true
                    use_oidc: true
                    
            -   name: Upload Brahe cache directory (Unix)
                if: runner.os != 'Windows'
                uses: actions/upload-artifact@v7
                with:
                    name: brahe-cache-${{ runner.os }}
                    path: ~/.cache/brahe/
                    retention-days: 1
                    if-no-files-found: ignore
            -   name: Upload Brahe cache directory (Windows)
                if: runner.os == 'Windows'
                uses: actions/upload-artifact@v7
                with:
                    name: brahe-cache-${{ runner.os }}
                    path: ~\\.cache\\brahe\\
                    retention-days: 1
                    if-no-files-found: ignore
    test-rust-docs:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                # os: [ubuntu-latest]
                os: [ubuntu-latest, macos-latest, windows-latest]
                rust-toolchain: [stable]
        steps:
            -   uses: actions/checkout@v7.0.1
            # See "test-rust" job above for the shared-key/save-if cache scheme.
            -   name: Set up Rust toolchain with cache
                uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
                with:
                    toolchain: ${{ matrix.rust-toolchain }}
                    cache-shared-key: test-rust-docs
                    cache-save-if: ${{ github.ref == 'refs/heads/main' }}
            -   name: Set default Rust toolchain
                run: |
                    rustup update ${{ matrix.rust-toolchain }}
                    rustup default ${{ matrix.rust-toolchain }}
            -   name: Restore NAIF kernels cache
                id: naif-cache
                uses: actions/cache/restore@v6.1.0
                with:
                    path: ~/.cache/brahe/naif
                    key: naif-kernels-v1
            -   name: Seed DE440s test asset into the NAIF cache
                shell: bash
                run: |
                    mkdir -p ~/.cache/brahe/naif
                    cp test_assets/de440s.bsp ~/.cache/brahe/naif/
            -   name: Restore ICGEM cache
                id: icgem-cache
                uses: actions/cache/restore@v6.1.0
                with:
                    path: ~/.cache/brahe/icgem
                    key: brahe-icgem-v1
            -   name: Restore SBDB + Horizons cache
                id: sbdb-horizons-cache
                uses: actions/cache/restore@v6.1.0
                with:
                    path: |
                        ~/.cache/brahe/sbdb
                        ~/.cache/brahe/horizons
                    key: brahe-sbdb-horizons-v1
            -   name: Restore star catalog downloads
                id: star-catalogs-cache
                uses: actions/cache/restore@v6.1.0
                with:
                    path: |
                        ~/.cache/brahe/star_catalogs/FK5_Catalog.txt
                        ~/.cache/brahe/star_catalogs/Hipparcos_Catalog.txt
                    key: star-catalogs-v1
            # This job has no Python environment to run the warm script, so it
            # is offline only when every restored cache family (NAIF, ICGEM,
            # SBDB + Horizons, star catalogs) was an exact hit; otherwise it
            # downloads the kernels once.
            -   name: Run Rust doc tests
                env:
                    BRAHE_NETWORK_MODE: ${{ steps.naif-cache.outputs.cache-hit == 'true' && steps.icgem-cache.outputs.cache-hit == 'true' && steps.sbdb-horizons-cache.outputs.cache-hit == 'true' && steps.star-catalogs-cache.outputs.cache-hit == 'true' && inputs.network_mode || 'online' }}
                run: cargo test --doc -- --test-threads=1
    