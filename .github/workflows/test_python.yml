name: Test Python
on:
    workflow_call:
        inputs:
            python-versions:
                description: 'JSON array of Python versions to test'
                required: false
                type: string
                default: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
            coverage-python-version:
                description: 'Python version used for the coverage-instrumented build'
                required: false
                type: string
                default: '3.13'
            network_mode:
                description: "BRAHE_NETWORK_MODE for the test steps."
                type: string
                default: "offline"
            os-matrix:
                description: "JSON array of runners for the test matrix."
                type: string
                default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
            python-test-scope:
                description: >-
                    `full` runs the whole suite. `smoke` runs only the
                    path- and IO-sensitive directories, which is every area with
                    a recorded history of Windows-only Python failures. Switching
                    scope is this one input; the directory list lives in
                    SMOKE_PATHS below so it is defined in a single place.
                type: string
                default: "full"
jobs:
    test-python:
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        permissions:
            id-token: write
        env:
            BRAHE_NETWORK_MODE: ${{ inputs.network_mode }}
            # The smoke subset: CLI, cache/IO, and dataset handling. Commit
            # 16755ce2 fixed Windows-only failures under tests/cli and commit
            # e486a937 fixed cache-path handling, so this covers every area with
            # a recorded history of platform-specific Python failures. The rest
            # of the suite is platform-independent computation already exercised
            # by the Rust matrix. Defined once here so changing the subset is a
            # single edit.
            SMOKE_PATHS: tests/cli tests/utils tests/eop tests/space_weather tests/datasets
        strategy:
            matrix:
                os: ${{ fromJSON(inputs.os-matrix) }}
                python-version: ${{ fromJSON(inputs.python-versions) }}
                rust-toolchain: [stable]
        steps:
            # Cargo cache scheme: this job runs from both pr_tests.yml (PRs) and
            # unit_tests.yml (push to main). Shared-key is stable across the
            # python-version matrix (same Rust build either way), so only main
            # saves refresh it and PRs restore that warm cache instead of
            # building their own throwaway, ref-scoped one.
            -   name: Set up Rust toolchain
                uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
                with:
                    toolchain: ${{ matrix.rust-toolchain }}
                    cache-shared-key: test-python
                    cache-save-if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
            -   name: Set default Rust toolchain
                run: |
                    rustup update ${{ matrix.rust-toolchain }}
                    rustup default ${{ matrix.rust-toolchain }}
            -   uses: actions/checkout@v7.0.1
            # Every SPICE kernel the unit suites auto-load is a committed test
            # asset, so the suites run offline straight from a clone with no
            # download step and no cache to warm. tests/test_frames.py loads
            # mar099s directly, and BRAHE_NETWORK_MODE is offline, so a missing
            # kernel is a test failure rather than a slow path.
            -   name: Seed the SPICE test kernels
                shell: bash
                run: |
                    mkdir -p ~/.cache/brahe/naif
                    cp test_assets/de440s.bsp ~/.cache/brahe/naif/
                    cp test_assets/mar099s.bsp ~/.cache/brahe/naif/
                    cp test_assets/moon_pa_de440_200625.bpc ~/.cache/brahe/naif/
            -   name: Install the latest version of uv
                uses: astral-sh/setup-uv@v10.0.1
                with:
                    enable-cache: true
            -   name: Install Python ${{ matrix.python-version }}
                run: uv python install ${{ matrix.python-version }}

            -   name: Install dependencies
                run: uv sync --group test --all-extras --frozen --python ${{ matrix.python-version }}

            # ── Coverage-instrumented build (ubuntu + coverage-python-version only) ──

            -   name: Install cargo-llvm-cov
                if: matrix.os == 'ubuntu-latest' && matrix.python-version == inputs.coverage-python-version
                uses: taiki-e/install-action@cargo-llvm-cov

            -   name: Build extension (coverage)
                if: matrix.os == 'ubuntu-latest' && matrix.python-version == inputs.coverage-python-version
                run: |
                    cargo llvm-cov clean --workspace
                    eval "$(cargo llvm-cov show-env --export-prefix)"
                    uv pip install maturin --quiet
                    uv run maturin develop --uv --features pyo3/extension-module


            -   name: Test with coverage
                if: matrix.os == 'ubuntu-latest' && matrix.python-version == inputs.coverage-python-version
                run: |
                    eval "$(cargo llvm-cov show-env --export-prefix)"
                    uv run --frozen pytest tests/ \
                        --cov=brahe \
                        --cov-report=xml:python-coverage.xml \
                        --cov-report=term
                    cargo llvm-cov report --lcov --output-path python-rust-coverage.lcov

            -   name: Build extension (standard)
                if: matrix.os != 'ubuntu-latest' || matrix.python-version != inputs.coverage-python-version
                run: uv pip install -e .


            -   name: Test with python ${{ matrix.python-version }}
                if: matrix.os != 'ubuntu-latest' || matrix.python-version != inputs.coverage-python-version
                shell: bash
                run: |
                    if [ "${{ inputs.python-test-scope }}" = "smoke" ]; then
                        # shellcheck disable=SC2086
                        uv run --frozen pytest $SMOKE_PATHS -v
                    else
                        uv run --frozen pytest tests/ -v
                    fi

            -   name: Upload Python coverage to Codecov
                if: matrix.os == 'ubuntu-latest' && matrix.python-version == inputs.coverage-python-version
                uses: codecov/codecov-action@v7.0.0
                env:
                    CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
                with:
                    files: python-coverage.xml
                    flags: python
                    fail_ci_if_error: false
                    verbose: true
                    use_oidc: true

            -   name: Upload Python-Rust coverage to Codecov
                if: matrix.os == 'ubuntu-latest' && matrix.python-version == inputs.coverage-python-version
                uses: codecov/codecov-action@v7.0.0
                env:
                    CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
                with:
                    files: python-rust-coverage.lcov
                    flags: python-rust
                    fail_ci_if_error: false
                    verbose: true
                    use_oidc: true
