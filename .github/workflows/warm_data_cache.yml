name: Warm Brahe Data Cache

# Keeps ~/.cache/brahe (NAIF kernels, ICGEM gravity models, SBDB + Horizons,
# FK5/Hipparcos star catalogs, Celestrak GP data) from being evicted by
# GitHub's 7-day "not accessed" cache eviction policy. Each family restores,
# warms, and saves independently, so one unreachable mirror never blocks the
# others: every warm step runs with `continue-on-error: true` and the save
# steps are gated on their own family's outcome. Most weeks every family
# restores an exact cache-key hit and the warm steps are no-ops, but a
# restore still counts as an access and resets the 7-day idle-eviction clock,
# which is sufficient to keep the caches alive for the reusable test
# workflows and integration_tests.yml. Celestrak is the only mutable family:
# it is refreshed and saved under the run id on every run, and consumers
# restore the newest entry by prefix.
on:
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

jobs:
    warm-cache:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7.0.1

            -   name: Set up Rust toolchain
                uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
                with:
                    toolchain: stable

            -   name: Install the latest version of uv
                uses: astral-sh/setup-uv@v10.0.1
                with:
                    enable-cache: true

            -   name: Install Python 3.14
                run: uv python install 3.14

            -   name: Install dependencies
                run: uv sync --all-extras --frozen

            -   name: Build Python extension
                run: uv pip install -e ".[all]"

            -   name: Install just
                uses: extractions/setup-just@v4

            # ── NAIF kernels ──────────────────────────────────────────────
            -   name: Restore NAIF kernels cache
                id: naif-cache
                uses: actions/cache/restore@v6.1.0
                with:
                    path: ~/.cache/brahe/naif
                    key: naif-kernels-v1
            -   name: Warm NAIF kernels
                id: warm-naif
                continue-on-error: true
                env:
                    BRAHE_NETWORK_MODE: online
                run: uv run --frozen python scripts/warm_data_cache.py --only kernel
            -   name: Save NAIF kernels cache
                if: steps.warm-naif.outcome == 'success' && steps.naif-cache.outputs.cache-hit != 'true'
                uses: actions/cache/save@v6.1.0
                with:
                    path: ~/.cache/brahe/naif
                    key: naif-kernels-v1

            # ── ICGEM gravity models ──────────────────────────────────────
            -   name: Restore ICGEM cache
                id: icgem-cache
                uses: actions/cache/restore@v6.1.0
                with:
                    path: ~/.cache/brahe/icgem
                    key: brahe-icgem-v1
            -   name: Warm ICGEM models
                id: warm-icgem
                continue-on-error: true
                env:
                    BRAHE_NETWORK_MODE: online
                run: uv run --frozen python scripts/warm_data_cache.py --only icgem
            -   name: Save ICGEM cache
                if: steps.warm-icgem.outcome == 'success' && steps.icgem-cache.outputs.cache-hit != 'true'
                uses: actions/cache/save@v6.1.0
                with:
                    path: ~/.cache/brahe/icgem
                    key: brahe-icgem-v1

            # ── SBDB + Horizons ───────────────────────────────────────────
            -   name: Restore SBDB + Horizons cache
                id: sbdb-horizons-cache
                uses: actions/cache/restore@v6.1.0
                with:
                    path: |
                        ~/.cache/brahe/sbdb
                        ~/.cache/brahe/horizons
                    key: brahe-sbdb-horizons-v1
            -   name: Warm SBDB + Horizons
                id: warm-horizons
                continue-on-error: true
                env:
                    BRAHE_NETWORK_MODE: online
                run: uv run --frozen python scripts/warm_data_cache.py --only horizons
            -   name: Save SBDB + Horizons cache
                if: steps.warm-horizons.outcome == 'success' && steps.sbdb-horizons-cache.outputs.cache-hit != 'true'
                uses: actions/cache/save@v6.1.0
                with:
                    path: |
                        ~/.cache/brahe/sbdb
                        ~/.cache/brahe/horizons
                    key: brahe-sbdb-horizons-v1

            # ── Celestrak (mutable: refreshed and saved on every run) ─────
            -   name: Restore Celestrak cache
                uses: actions/cache/restore@v6.1.0
                with:
                    path: ~/.cache/brahe/celestrak
                    key: brahe-celestrak-${{ github.run_id }}
                    restore-keys: |
                        brahe-celestrak-
            -   name: Warm Celestrak groups
                id: warm-celestrak
                continue-on-error: true
                env:
                    BRAHE_NETWORK_MODE: online
                run: uv run --frozen python scripts/warm_data_cache.py --only celestrak --refresh
            -   name: Save Celestrak cache
                if: steps.warm-celestrak.outcome == 'success'
                uses: actions/cache/save@v6.1.0
                with:
                    path: ~/.cache/brahe/celestrak
                    key: brahe-celestrak-${{ github.run_id }}

            # ── Star catalogs (curl; not manifest-driven) ─────────────────
            # FK5 + Hipparcos only. Explicit file paths (not the whole
            # star_catalogs/ dir) so the 526 MB Tycho-2 catalog is never
            # warmed or cached here.
            -   name: Restore star catalog downloads
                id: star-catalogs-cache
                uses: actions/cache/restore@v6.1.0
                with:
                    path: |
                        ~/.cache/brahe/star_catalogs/FK5_Catalog.txt
                        ~/.cache/brahe/star_catalogs/Hipparcos_Catalog.txt
                    key: star-catalogs-v1

            # The mirror 403s default curl user agents, hence -A. Skips the
            # download when the file is already cached (restore-only weeks).
            # Each catalog is downloaded independently and failures are
            # reported together at the end, so one unreachable file does not
            # skip the other.
            -   name: Warm star catalog cache (re-download anything evicted)
                id: warm-star-catalogs
                continue-on-error: true
                run: |
                    dir=~/.cache/brahe/star_catalogs
                    mkdir -p "$dir"
                    failed=""
                    warm_catalog() {
                        name=$1
                        url=$2
                        if [ -s "$dir/$name" ]; then
                            echo "  $name -> cached"
                        elif curl -fsSL --retry 3 --retry-delay 5 \
                            -A "Mozilla/5.0" -o "$dir/$name.tmp" "$url" \
                            && mv "$dir/$name.tmp" "$dir/$name"; then
                            echo "  $name -> downloaded"
                        else
                            rm -f "$dir/$name.tmp"
                            echo "  $name -> FAILED"
                            failed="$failed $name"
                        fi
                    }
                    warm_catalog FK5_Catalog.txt \
                        https://www.simplespacedata.org/star_catalog/cds/fk5/latest/FK5_Catalog.txt
                    warm_catalog Hipparcos_Catalog.txt \
                        https://www.simplespacedata.org/star_catalog/cds/hipparcos/latest/Hipparcos_Catalog.txt
                    if [ -n "$failed" ]; then
                        echo "Star catalog downloads failed:$failed" >&2
                        exit 1
                    fi
            -   name: Save star catalog downloads
                if: steps.warm-star-catalogs.outcome == 'success' && steps.star-catalogs-cache.outputs.cache-hit != 'true'
                uses: actions/cache/save@v6.1.0
                with:
                    path: |
                        ~/.cache/brahe/star_catalogs/FK5_Catalog.txt
                        ~/.cache/brahe/star_catalogs/Hipparcos_Catalog.txt
                    key: star-catalogs-v1

            # ── Plot resources (textures, basemap, cartopy) ───────────────
            -   name: Cache 3D body textures
                uses: actions/cache@v6.1.0
                with:
                    path: ~/.cache/brahe/textures
                    key: brahe-3d-textures-v2
            -   name: Cache Natural Earth land basemap
                uses: actions/cache@v6.1.0
                with:
                    path: ~/.cache/brahe/natural_earth
                    key: natural-earth-50m-land-v1
            -   name: Cache cartopy Natural Earth data
                uses: actions/cache@v6.1.0
                with:
                    path: ~/.local/share/cartopy
                    key: cartopy-natural-earth-v1
            -   name: Warm plot resources
                id: warm-plots
                continue-on-error: true
                env:
                    BRAHE_NETWORK_MODE: online
                run: just download-resources

            -   name: Fail if any family failed to warm
                if: >-
                    steps.warm-naif.outcome == 'failure' ||
                    steps.warm-icgem.outcome == 'failure' ||
                    steps.warm-horizons.outcome == 'failure' ||
                    steps.warm-celestrak.outcome == 'failure' ||
                    steps.warm-star-catalogs.outcome == 'failure' ||
                    steps.warm-plots.outcome == 'failure'
                run: |
                    echo "::error::One or more cache families failed to warm (see step outcomes above)"
                    exit 1

    # pr_tests.yml's "validate-rust-package" and "validate-python-package" jobs
    # only ever run on pull requests, so with cache-save-if gated to main (see
    # those jobs) nothing would otherwise populate their caches. These two jobs
    # mirror those builds on main's weekly schedule under the same shared-keys
    # so PRs always find a warm, restorable cache. Ubuntu-only, matching what
    # pr_tests.yml actually runs on.
    warm-validate-rust-package-cache:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7.0.1

            -   name: Set up Rust toolchain
                uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
                with:
                    toolchain: stable
                    cache-shared-key: validate-rust-package
                    cache-save-if: ${{ github.ref == 'refs/heads/main' }}

            -   name: Install the latest version of uv
                uses: astral-sh/setup-uv@v10.0.1
                with:
                    enable-cache: true

            -   name: Install Python 3.14
                run: uv python install 3.14

            -   name: Install just
                uses: extractions/setup-just@v4

            -   name: Build and validate Rust package
                run: just build --lang rust

    warm-validate-python-package-cache:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7.0.1

            -   name: Set up Rust toolchain
                uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
                with:
                    toolchain: stable
                    cache-shared-key: validate-python-package
                    cache-save-if: ${{ github.ref == 'refs/heads/main' }}

            -   name: Install the latest version of uv
                uses: astral-sh/setup-uv@v10.0.1
                with:
                    enable-cache: true

            -   name: Install Python 3.14
                run: uv python install 3.14

            -   name: Install just
                uses: extractions/setup-just@v4

            -   name: Build and validate Python package
                run: just build --lang python
