name: Brahe data cache
description: >-
    Restore or save the per-family brahe data caches. Families are keyed from
    .github/brahe-data-manifest.txt so a manifest edit rolls every key, and a
    restore that only matched an older key counts as a miss so the caller warms
    the new entries and saves under the current key.
inputs:
    families:
        description: >-
            Space-separated families to act on: naif, icgem, sbdb-horizons,
            star-catalogs, celestrak.
        required: true
    mode:
        description: "`restore` (default) or `save`."
        required: false
        default: restore
outputs:
    missed:
        description: Space-separated families that had no usable cache (restore mode).
        value: ${{ steps.missed.outputs.families }}
    warm-args:
        description: "`scripts/warm_data_cache.py --only` flags covering the missed families."
        value: ${{ steps.missed.outputs.warm_args }}
runs:
    using: composite
    steps:
        -   name: Restore NAIF kernels
            id: naif
            if: inputs.mode == 'restore' && contains(inputs.families, 'naif')
            uses: actions/cache/restore@v6.1.0
            with:
                path: ~/.cache/brahe/naif
                key: naif-kernels-v1-${{ hashFiles('.github/brahe-data-manifest.txt') }}
                restore-keys: |
                    naif-kernels-v1-
        -   name: Restore ICGEM models
            id: icgem
            if: inputs.mode == 'restore' && contains(inputs.families, 'icgem')
            uses: actions/cache/restore@v6.1.0
            with:
                path: ~/.cache/brahe/icgem
                key: brahe-icgem-v1-${{ hashFiles('.github/brahe-data-manifest.txt') }}
                restore-keys: |
                    brahe-icgem-v1-
        -   name: Restore SBDB + Horizons
            id: sbdb-horizons
            if: inputs.mode == 'restore' && contains(inputs.families, 'sbdb-horizons')
            uses: actions/cache/restore@v6.1.0
            with:
                path: |
                    ~/.cache/brahe/sbdb
                    ~/.cache/brahe/horizons
                key: brahe-sbdb-horizons-v1-${{ hashFiles('.github/brahe-data-manifest.txt') }}
                restore-keys: |
                    brahe-sbdb-horizons-v1-
        -   name: Restore star catalogs
            id: star-catalogs
            if: inputs.mode == 'restore' && contains(inputs.families, 'star-catalogs')
            uses: actions/cache/restore@v6.1.0
            with:
                path: |
                    ~/.cache/brahe/star_catalogs/FK5_Catalog.txt
                    ~/.cache/brahe/star_catalogs/Hipparcos_Catalog.txt
                key: star-catalogs-v1
        -   name: Restore Celestrak groups
            id: celestrak
            if: inputs.mode == 'restore' && contains(inputs.families, 'celestrak')
            uses: actions/cache/restore@v6.1.0
            with:
                path: ~/.cache/brahe/celestrak
                key: brahe-celestrak-${{ github.run_id }}
                restore-keys: |
                    brahe-celestrak-
        -   name: Record missed families
            id: missed
            if: inputs.mode == 'restore'
            shell: bash
            env:
                FAMILIES: ${{ inputs.families }}
                NAIF_HIT: ${{ steps.naif.outputs.cache-hit }}
                ICGEM_HIT: ${{ steps.icgem.outputs.cache-hit }}
                SBDB_HORIZONS_HIT: ${{ steps.sbdb-horizons.outputs.cache-hit }}
                STAR_CATALOGS_HIT: ${{ steps.star-catalogs.outputs.cache-hit }}
                CELESTRAK_MATCHED: ${{ steps.celestrak.outputs.cache-matched-key }}
            run: |
                has() { case " $FAMILIES " in *" $1 "*) return 0 ;; *) return 1 ;; esac; }
                missed=""
                args=""
                if has naif && [ "$NAIF_HIT" != "true" ]; then missed="$missed naif"; args="$args --only kernel"; fi
                if has icgem && [ "$ICGEM_HIT" != "true" ]; then missed="$missed icgem"; args="$args --only icgem"; fi
                if has sbdb-horizons && [ "$SBDB_HORIZONS_HIT" != "true" ]; then missed="$missed sbdb-horizons"; args="$args --only horizons"; fi
                if has star-catalogs && [ "$STAR_CATALOGS_HIT" != "true" ]; then missed="$missed star-catalogs"; fi
                if has celestrak && [ -z "$CELESTRAK_MATCHED" ]; then missed="$missed celestrak"; args="$args --only celestrak"; fi
                missed="${missed# }"
                args="${args# }"
                echo "families=$missed" >> "$GITHUB_OUTPUT"
                echo "warm_args=$args" >> "$GITHUB_OUTPUT"
                echo "requested: $FAMILIES"
                echo "missed:    ${missed:-none}"
        -   name: Save NAIF kernels
            if: inputs.mode == 'save' && contains(inputs.families, 'naif')
            uses: actions/cache/save@v6.1.0
            with:
                path: ~/.cache/brahe/naif
                key: naif-kernels-v1-${{ hashFiles('.github/brahe-data-manifest.txt') }}
        -   name: Save ICGEM models
            if: inputs.mode == 'save' && contains(inputs.families, 'icgem')
            uses: actions/cache/save@v6.1.0
            with:
                path: ~/.cache/brahe/icgem
                key: brahe-icgem-v1-${{ hashFiles('.github/brahe-data-manifest.txt') }}
        -   name: Save SBDB + Horizons
            if: inputs.mode == 'save' && contains(inputs.families, 'sbdb-horizons')
            uses: actions/cache/save@v6.1.0
            with:
                path: |
                    ~/.cache/brahe/sbdb
                    ~/.cache/brahe/horizons
                key: brahe-sbdb-horizons-v1-${{ hashFiles('.github/brahe-data-manifest.txt') }}
        -   name: Save star catalogs
            if: inputs.mode == 'save' && contains(inputs.families, 'star-catalogs')
            uses: actions/cache/save@v6.1.0
            with:
                path: |
                    ~/.cache/brahe/star_catalogs/FK5_Catalog.txt
                    ~/.cache/brahe/star_catalogs/Hipparcos_Catalog.txt
                key: star-catalogs-v1
        -   name: Save Celestrak groups
            if: inputs.mode == 'save' && contains(inputs.families, 'celestrak')
            uses: actions/cache/save@v6.1.0
            with:
                path: ~/.cache/brahe/celestrak
                key: brahe-celestrak-${{ github.run_id }}
