name: Test Examples

on:
  workflow_call:
    inputs:
      example_args:
        description: "Arguments passed to `just test-examples` (e.g. --ci-only, --network)."
        type: string
        default: "--ci-only"
      use_retry:
        description: >-
          Wrap the example run in a retry loop. Use for live-network runs
          (e.g. --network) where third-party services may throttle or blip.
          Also skips doc-plot generation, which is only needed on the PR path.
        type: boolean
        default: false
      network_mode:
        description: "BRAHE_NETWORK_MODE for the test/example/plot steps (warm steps stay online)."
        type: string
        default: "offline"
      job-timeout-minutes:
        description: >-
          Job cap. The default suits the offline run. A caller setting
          `use_retry` must raise this above that retry budget (3 attempts of 60
          minutes plus waits) or the retries are truncated before they finish.
        type: number
        default: 90

jobs:
  test-examples:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    env:
      RUST_TOOLCHAIN: stable
      BRAHE_NETWORK_MODE: ${{ inputs.network_mode }}
    steps:
      - uses: actions/checkout@v7.0.1

      # Cargo cache scheme: this job runs from pr_tests.yml (PRs), unit_tests.yml
      # (push to main), and integration_tests.yml (scheduled/dispatch --network
      # runs, which resolve to main). Only main saves refresh the shared cache;
      # PRs restore it instead of paying for their own unrestorable copy.
      - name: Set up Rust toolchain with cache
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-shared-key: test-examples
          cache-save-if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}

      - name: Set default Rust toolchain
        run: |
          rustup update ${{ env.RUST_TOOLCHAIN }}
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - name: Install rust-script for Rust examples
        timeout-minutes: 15
        run: cargo install rust-script

      # rust-script builds each example as its own crate against a shared
      # dependency build. That shared build is the expensive part: an example
      # compiles in about 80 seconds without it and relinks in about one second
      # with it. Restore-only on pull requests, matching the cargo caches; main
      # produces the copy every branch reads.
      - name: Restore rust-script build cache
        id: rust-script-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/rust-script
          key: rust-script-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'scripts/_build_utils.py') }}
          restore-keys: |
            rust-script-${{ runner.os }}-

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      # Restored before "Setup test assets in cache" below so the repo's
      # test_assets/de440s.bsp always wins over a stale cached copy. One step
      # restores every manifest-keyed family; whatever is missing (or predates
      # the manifest) is warmed once below and saved, so the parallel pools
      # never download live.
      - name: Restore data caches
        timeout-minutes: 15
        id: cache
        uses: ./.github/actions/data-cache
        with:
          families: naif icgem sbdb-horizons star-catalogs

      # Copy test assets to cache for examples that might use them.
      - name: Setup test assets in cache
        run: |
          mkdir -p ~/.cache/brahe/naif/
          if [ -f test_assets/de440s.bsp ]; then
            cp test_assets/de440s.bsp ~/.cache/brahe/naif/
            echo "Copied de440s.bsp test asset to cache"
          fi

      # The committed Celestrak groups keep the offline example runs
      # independent of Celestrak being reachable. They are deliberately NOT
      # seeded for the live-network run: copying them gives every file a current
      # modification time, and CelestrakClient serves anything inside its TTL
      # without a request, which would silently turn the live integration run
      # into another offline one.
      - name: Seed Celestrak groups from test assets
        if: inputs.network_mode != 'online'
        run: PYTHONPATH=scripts uv run --frozen python scripts/seed_celestrak_cache.py

      - name: Build Rust package
        run: cargo build

      - name: Build Python extension
        run: uv pip install -e .

      - name: Install just
        uses: extractions/setup-just@v4

      # Persist the network resources the examples/plots need so they are never
      # downloaded (or raced) live in the parallel pools below. Restored before
      # the warm-up step; GitHub evicts caches by last access, so each restore
      # (a hit) resets the 7-day eviction window and keeps the shared main-branch
      # caches alive. A miss re-populates them via the warm-up step's post-save.
      # Restore-only: the matching save below runs on main only.
      - name: Restore 3D body textures cache (Natural Earth + Solar System Scope planets)
        id: textures-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/brahe/textures
          key: brahe-3d-textures-v2

      - name: Restore Natural Earth land basemap cache
        id: natural-earth-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/brahe/natural_earth
          key: natural-earth-50m-land-v1

      - name: Restore cartopy Natural Earth data cache
        id: cartopy-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.local/share/cartopy
          key: cartopy-natural-earth-v1

      # Warm only what the restores above did not provide, serially, before the
      # parallel pools run offline.
      - name: Warm missing data families
        timeout-minutes: 15
        if: steps.cache.outputs.missed != ''
        env:
          BRAHE_NETWORK_MODE: online
          WARM_ARGS: ${{ steps.cache.outputs.warm-args }}
          MISSED: ${{ steps.cache.outputs.missed }}
        run: |
          if [ -n "$WARM_ARGS" ]; then
            # shellcheck disable=SC2086
            uv run --frozen python scripts/warm_data_cache.py $WARM_ARGS
          fi
          case " $MISSED " in
            *" star-catalogs "*)
              uv run --frozen python -c "import brahe as bh; bh.datasets.star_catalogs.get_fk5(); bh.datasets.star_catalogs.get_hipparcos()"
              ;;
          esac

      - name: Warm missing plot resources
        timeout-minutes: 15
        if: steps.textures-cache.outputs.cache-hit != 'true' || steps.natural-earth-cache.outputs.cache-hit != 'true' || steps.cartopy-cache.outputs.cache-hit != 'true'
        env:
          BRAHE_NETWORK_MODE: online
          TEXTURES_HIT: ${{ steps.textures-cache.outputs.cache-hit }}
          NATURAL_EARTH_HIT: ${{ steps.natural-earth-cache.outputs.cache-hit }}
          CARTOPY_HIT: ${{ steps.cartopy-cache.outputs.cache-hit }}
        run: |
          if [ "$TEXTURES_HIT" != "true" ]; then
            uv run --frozen python -c "from brahe.plots.texture_utils import download_natural_earth_texture; download_natural_earth_texture('50m')"
            uv run --frozen python -c "from brahe.plots.texture_utils import download_planet_texture; [download_planet_texture(b) for b in ('moon', 'mars', 'ceres')]"
          fi
          if [ "$NATURAL_EARTH_HIT" != "true" ]; then
            uv run --frozen python -c "from brahe.plots.basemap import get_natural_earth_land_shapefile; get_natural_earth_land_shapefile()"
          fi
          if [ "$CARTOPY_HIT" != "true" ]; then
            uv run --frozen python scripts/warm_cartopy.py
          fi

      # Save the families that were warmed. Runs on main save under the family
      # key; other refs save under a run-suffixed key that later runs of the
      # same ref find by prefix and that never blocks main's key.
      - name: Save data caches
        if: steps.cache.outputs.missed != ''
        continue-on-error: true
        uses: ./.github/actions/data-cache
        with:
          mode: save
          families: ${{ steps.cache.outputs.missed }}

      # Plot resources use fixed keys and save from main only: a PR-scoped save
      # of a fixed key is unreadable from main and from other PRs, yet it
      # blocks every later same-key save repo-wide ("Unable to reserve cache
      # ...").
      - name: Save 3D body textures cache (main only)
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && steps.textures-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/brahe/textures
          key: brahe-3d-textures-v2

      - name: Save Natural Earth land basemap cache (main only)
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && steps.natural-earth-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/brahe/natural_earth
          key: natural-earth-50m-land-v1

      - name: Save cartopy Natural Earth data cache (main only)
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && steps.cartopy-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.local/share/cartopy
          key: cartopy-natural-earth-v1

      - name: Test examples
        if: ${{ !inputs.use_retry }}
        run: just test-examples ${{ inputs.example_args }}

      # Live-network runs (e.g. --network) retry to absorb transient remote
      # throttling: the NETWORK-flagged examples run only here, and the
      # unflagged Celestrak GP examples run here too, refreshing `active`
      # (and the other warmed groups) live instead of from cache.
      - name: Test examples (with retries)
        if: ${{ inputs.use_retry }}
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 60
          command: just test-examples ${{ inputs.example_args }}

      # The NETWORK-flagged examples execute only in this --network run of
      # test-examples, so it is the only producer of their doc figures.
      # Persist docs/figures to the actions cache so the docs deploys
      # (update_docs.yml, docs_only.yml), whose own --ci-only example runs
      # skip these examples, can restore and overlay them. The per-run key is
      # unique; consumers use restore-keys prefix matching, which returns the
      # most recent entry.
      - name: Save network example figures to cache
        if: ${{ inputs.use_retry }}
        uses: actions/cache/save@v6.1.0
        with:
          path: docs/figures/
          key: network-example-figures-${{ github.run_id }}

      # Text-output analogue of the figures cache above. The NETWORK-flagged
      # examples execute only in this --network run of test-examples, so it
      # is the only producer of their captured stdout. Persist docs/outputs
      # so the docs deploys (update_docs.yml, docs_only.yml), whose own
      # --ci-only example runs skip these examples, can restore and overlay
      # it.
      - name: Save network example outputs to cache
        if: ${{ inputs.use_retry }}
        uses: actions/cache/save@v6.1.0
        with:
          path: docs/outputs/
          key: network-example-outputs-${{ github.run_id }}

      # Same-run hand-off of the NETWORK-flagged examples' figures/outputs to
      # the docs deploy. release.yml runs this --network job (via
      # integration_tests.yml) and update_docs.yml in the SAME run, so
      # update_docs can download these artifacts directly - more reliable than
      # the caches above, whose per-run reservation collides when release.yml
      # invokes test_examples.yml twice concurrently (--ci-only and --network),
      # leaving the release deploy with no network figures. The caches remain
      # the cross-run fallback for docs deploys (docs_only.yml, main pushes)
      # that do not run this job in the same run. Distinct artifact names from
      # the --ci-only path's doc-figures/doc-outputs so the two never collide.
      - name: Upload network example figures as artifact
        if: ${{ inputs.use_retry }}
        uses: actions/upload-artifact@v7
        with:
          name: network-doc-figures
          path: docs/figures/
          retention-days: 7

      - name: Upload network example outputs as artifact
        if: ${{ inputs.use_retry }}
        uses: actions/upload-artifact@v7
        with:
          name: network-doc-outputs
          path: docs/outputs/
          retention-days: 7

      # Drop the per-example binaries before saving: they relink in about a
      # second each, and keeping 376 of them would grow the cache past the
      # repository's budget. The shared dependency build is what is worth
      # carrying between runs.
      - name: Prune per-example binaries from the rust-script cache
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        run: |
          release=~/.cache/rust-script/binaries/release
          [ -d "$release" ] || exit 0
          find "$release" -maxdepth 1 -type f -delete
          find "$release/.fingerprint" -maxdepth 1 -type d -name 'examples__*' \
            -exec rm -rf {} + 2>/dev/null || true
          rm -rf ~/.cache/rust-script/projects

      - name: Save rust-script build cache (main only)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/rust-script
          key: rust-script-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'scripts/_build_utils.py') }}

      - name: Generate documentation plots
        if: ${{ !inputs.use_retry }}
        run: just make-plots

      - name: Upload figures as artifact
        if: ${{ !inputs.use_retry }}
        uses: actions/upload-artifact@v7
        with:
          name: doc-figures
          path: docs/figures/
          # Keep long enough that re-running the deploy job a day or two later
          # (e.g. after CI throttling/retries) still finds the artifact.
          retention-days: 7

      - name: Upload example outputs as artifact
        if: ${{ !inputs.use_retry }}
        uses: actions/upload-artifact@v7
        with:
          name: doc-outputs
          path: docs/outputs/
          retention-days: 7
