name: Test Python
on:
    workflow_call:
        inputs:
            python-versions:
                description: 'JSON array of Python versions to test'
                required: false
                type: string
                default: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
            coverage-python-version:
                description: 'Python version used for the coverage-instrumented build'
                required: false
                type: string
                default: '3.13'
            network_mode:
                description: "BRAHE_NETWORK_MODE for the test steps."
                type: string
                default: "offline"
jobs:
    data-cache:
        # Restores the data families the unit suites read. When a family is
        # missing, or its cache predates the manifest, this job downloads the
        # entries once and saves them so the matrix legs below only restore.
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7.0.1
            -   name: Restore data caches
                id: cache
                uses: ./.github/actions/data-cache
                with:
                    families: naif
            -   name: Set up Rust toolchain
                if: steps.cache.outputs.missed != ''
                uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
                with:
                    cache-shared-key: test-python
                    cache-save-if: false
            -   name: Install uv
                if: steps.cache.outputs.missed != ''
                uses: astral-sh/setup-uv@v10.0.1
                with:
                    enable-cache: true
            -   name: Build brahe
                if: steps.cache.outputs.missed != ''
                run: |
                    uv python install 3.12
                    uv sync --group test --all-extras --frozen --python 3.12
                    uv pip install maturin --quiet
                    uv run maturin develop --uv --features pyo3/extension-module
            -   name: Warm missed families
                if: steps.cache.outputs.missed != ''
                env:
                    BRAHE_NETWORK_MODE: online
                    WARM_ARGS: ${{ steps.cache.outputs.warm-args }}
                    MISSED: ${{ steps.cache.outputs.missed }}
                run: |
                    if [ -n "$WARM_ARGS" ]; then
                        # shellcheck disable=SC2086
                        uv run --frozen python scripts/warm_data_cache.py $WARM_ARGS
                    fi
                    case " $MISSED " in
                        *" star-catalogs "*)
                            uv run --frozen python -c "import brahe as bh; bh.datasets.star_catalogs.get_fk5(); bh.datasets.star_catalogs.get_hipparcos()"
                            ;;
                    esac
            -   name: Save data caches
                if: steps.cache.outputs.missed != ''
                uses: ./.github/actions/data-cache
                with:
                    mode: save
                    families: ${{ steps.cache.outputs.missed }}
    test-python:
        runs-on: ${{ matrix.os }}
        needs: data-cache
        permissions:
            id-token: write
        env:
            BRAHE_NETWORK_MODE: ${{ inputs.network_mode }}
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                python-version: ${{ fromJSON(inputs.python-versions) }}
                rust-toolchain: [stable]
        steps:
            # Cargo cache scheme: this job runs from both pr_tests.yml (PRs) and
            # unit_tests.yml (push to main). Shared-key is stable across the
            # python-version matrix (same Rust build either way), so only main
            # saves refresh it and PRs restore that warm cache instead of
            # building their own throwaway, ref-scoped one.
            -   name: Set up Rust toolchain
                uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
                with:
                    toolchain: ${{ matrix.rust-toolchain }}
                    cache-shared-key: test-python
                    cache-save-if: ${{ github.ref == 'refs/heads/main' }}
            -   name: Set default Rust toolchain
                run: |
                    rustup update ${{ matrix.rust-toolchain }}
                    rustup default ${{ matrix.rust-toolchain }}
            -   uses: actions/checkout@v7.0.1
            -   name: Install the latest version of uv
                uses: astral-sh/setup-uv@v10.0.1
                with:
                    enable-cache: true
            -   name: Install Python ${{ matrix.python-version }}
                run: uv python install ${{ matrix.python-version }}

            -   name: Restore data caches
                uses: ./.github/actions/data-cache
                with:
                    families: naif
            -   name: Install dependencies
                run: uv sync --group test --all-extras --frozen --python ${{ matrix.python-version }}

            # ── Coverage-instrumented build (ubuntu + coverage-python-version only) ──

            -   name: Install cargo-llvm-cov
                if: matrix.os == 'ubuntu-latest' && matrix.python-version == inputs.coverage-python-version
                uses: taiki-e/install-action@cargo-llvm-cov

            -   name: Build extension (coverage)
                if: matrix.os == 'ubuntu-latest' && matrix.python-version == inputs.coverage-python-version
                run: |
                    cargo llvm-cov clean --workspace
                    eval "$(cargo llvm-cov show-env --export-prefix)"
                    uv pip install maturin --quiet
                    uv run maturin develop --uv --features pyo3/extension-module


            -   name: Test with coverage
                if: matrix.os == 'ubuntu-latest' && matrix.python-version == inputs.coverage-python-version
                run: |
                    eval "$(cargo llvm-cov show-env --export-prefix)"
                    uv run --frozen pytest tests/ \
                        --cov=brahe \
                        --cov-report=xml:python-coverage.xml \
                        --cov-report=term
                    cargo llvm-cov report --lcov --output-path python-rust-coverage.lcov

            -   name: Build extension (standard)
                if: matrix.os != 'ubuntu-latest' || matrix.python-version != inputs.coverage-python-version
                run: uv pip install -e .


            -   name: Test with python ${{ matrix.python-version }}
                if: matrix.os != 'ubuntu-latest' || matrix.python-version != inputs.coverage-python-version
                run: uv run --frozen pytest tests/ -v

            -   name: Upload Python coverage to Codecov
                if: matrix.os == 'ubuntu-latest' && matrix.python-version == inputs.coverage-python-version
                uses: codecov/codecov-action@v7.0.0
                env:
                    CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
                with:
                    files: python-coverage.xml
                    flags: python
                    fail_ci_if_error: false
                    verbose: true
                    use_oidc: true

            -   name: Upload Python-Rust coverage to Codecov
                if: matrix.os == 'ubuntu-latest' && matrix.python-version == inputs.coverage-python-version
                uses: codecov/codecov-action@v7.0.0
                env:
                    CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
                with:
                    files: python-rust-coverage.lcov
                    flags: python-rust
                    fail_ci_if_error: false
                    verbose: true
                    use_oidc: true
