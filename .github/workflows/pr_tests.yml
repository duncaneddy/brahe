name: PR Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'profiles/**'

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-skip:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        run: |
          echo "should_skip=false" >> $GITHUB_OUTPUT

  test-rust:
    needs: [check-skip]
    if: needs.check-skip.outputs.should_skip == 'false'
    uses: ./.github/workflows/test_rust.yml
    secrets: inherit

  delay-python:
    needs: [check-skip]
    if: needs.check-skip.outputs.should_skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for Rust tests to claim runners
        run: sleep 15

  # Pull requests test the oldest supported Python (the declared floor in
  # pyproject.toml) to catch breakage of the minimum-supported version. The full
  # version matrix runs on push to main.
  test-python:
    needs: [delay-python]
    if: needs.delay-python.result == 'success'
    uses: ./.github/workflows/test_python.yml
    with:
      python-versions: '["3.10"]'
      coverage-python-version: '3.10'
      os-matrix: '["ubuntu-latest", "macos-latest"]'
      python-test-scope: full
    secrets: inherit

  # Windows runs the smoke subset rather than the whole suite. It is roughly
  # 1.8x slower than ubuntu, so the full run would set the critical path, while
  # the subset covers every area with a recorded history of Windows-only Python
  # failures. The full Windows suite still runs on push to main.
  test-python-windows:
    needs: [delay-python]
    if: needs.delay-python.result == 'success'
    uses: ./.github/workflows/test_python.yml
    with:
      python-versions: '["3.10"]'
      coverage-python-version: 'none'
      os-matrix: '["windows-latest"]'
      python-test-scope: smoke
    secrets: inherit

  test-examples:
    needs: [check-skip]
    if: needs.check-skip.outputs.should_skip == 'false'
    uses: ./.github/workflows/test_examples.yml

  # Validate crates.io package builds correctly and is under size limit.
  # Runs in parallel with test-rust (both gate only on check-skip) so the
  # package build and the test suite finish concurrently rather than serially.
  validate-rust-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [check-skip]
    if: needs.check-skip.outputs.should_skip == 'false'
    env:
      RUST_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7.0.1

      # This job only ever runs on PRs, so it never sees a main-branch save.
      # warm_data_cache.yml runs the equivalent build weekly on main under the
      # same shared-key to keep a restorable cache warm for PRs.
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-shared-key: validate-rust-package
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set default Rust toolchain
        run: |
          rustup update ${{ env.RUST_TOOLCHAIN }}
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Build and validate Rust package
        run: just build --lang rust

  # Validate PyPI packages build correctly with proper metadata.
  # Gated on delay-python (not test-python) so it runs in parallel with
  # test-python while still respecting the runner-claim stagger that keeps
  # Rust jobs ahead of Python jobs in the runner queue.
  validate-python-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [delay-python]
    if: needs.delay-python.result == 'success'
    env:
      RUST_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7.0.1

      # This job only ever runs on PRs, so it never sees a main-branch save.
      # warm_data_cache.yml runs the equivalent build weekly on main under the
      # same shared-key to keep a restorable cache warm for PRs.
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-shared-key: validate-python-package
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set default Rust toolchain
        run: |
          rustup update ${{ env.RUST_TOOLCHAIN }}
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Build and validate Python package
        run: just build --lang python

  # Build docs to verify no breakage, but don't deploy
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [check-skip, test-rust, test-python, test-examples]
    if: needs.check-skip.outputs.should_skip == 'false'
    env:
      RUST_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7.0.1

      # Shared with update_docs.yml/docs_only.yml's doc-build jobs, which both
      # run on pushes to main and so are the ones that actually save this
      # cache; this PR job only ever restores it.
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-shared-key: docs-build
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set default Rust toolchain
        run: |
          rustup update ${{ env.RUST_TOOLCHAIN }}
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group docs --all-extras --frozen

      - name: Build Python extension
        run: uv pip install -e ".[plots]"

      - name: Generate type stubs
        run: ./scripts/generate_stubs.sh

      # Download artifacts from test-examples
      - name: Download test-examples artifacts
        uses: actions/download-artifact@v8
        with:
          name: doc-figures
          path: docs/figures/

      - name: Build documentation (verify only, no deployment)
        run: uv run properdocs build

  # Single aggregation check to require in branch protection. Matrix job names
  # (e.g. "test-rust (ubuntu-latest, stable)") are brittle to reference directly,
  # so require only this job: it fails if any upstream job failed or was cancelled.
  # `skipped` is tolerated so path-filtered/conditional jobs don't wedge merges.
  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `always()` would run this job even when the whole workflow is cancelled,
    # which is what happens whenever a push supersedes an in-flight run. It
    # would then read `cancelled` from every upstream job and report failure,
    # leaving a red aggregate check behind for a run that was abandoned rather
    # than broken. `!cancelled()` still runs the job when an upstream job fails,
    # which is the case it exists to catch, and still fails when an individual
    # job is cancelled on its own — a job hitting its timeout, for instance —
    # because that cancels the job without cancelling the workflow.
    if: ${{ !cancelled() }}
    # Include the gating jobs (check-skip, delay-python) so their failure is
    # caught directly. Otherwise a failed gate would only cascade into skipped
    # downstream jobs, which this check tolerates, yielding a false green.
    needs:
      - check-skip
      - test-rust
      - delay-python
      - test-python
      - test-python-windows
      - test-examples
      - validate-rust-package
      - validate-python-package
      - build-docs
    steps:
      - name: Verify all required jobs passed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Upstream job results: $results"
          for r in $results; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::A required job did not pass (result: $r)"
              exit 1
            fi
          done
          echo "All required jobs passed."
