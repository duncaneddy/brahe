# Fast-path workflow for documentation-only changes
# Triggers only when changes are exclusively in docs/, examples/, plots/, or properdocs.yml
# The 'paths' filter ensures this only runs for docs changes
# The 'paths-ignore' in commit.yml ensures full CI doesn't run for docs-only changes

name: Documentation Only

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'examples/**'
      - 'plots/**'
      - 'properdocs.yml'
  workflow_dispatch: # Allow manual triggering

# Prevent concurrent gh-pages deployments
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RUST_TOOLCHAIN: stable
      BRAHE_NETWORK_MODE: offline
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # Fetch all history for accurate git revision dates and mike versioning

      - name: Configure Git for mike
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

      # Shared with pr_tests.yml's "build-docs" job and update_docs.yml. This
      # workflow only runs on pushes to main (docs-path-filtered), so it is
      # safe to always allow saves here.
      - name: Set up Rust toolchain with cache
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-shared-key: docs-build
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set default Rust toolchain
        run: |
          rustup update ${{ env.RUST_TOOLCHAIN }}
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - name: Install rust-script for Rust examples
        run: cargo install rust-script

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group docs --all-extras --frozen

      # Build Python extension
      - name: Build Python extension
        run: uv pip install -e .

      - name: Generate type stubs
        run: ./scripts/generate_stubs.sh

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Restore NAIF kernels cache
        id: naif-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/brahe/naif
          key: naif-kernels-v1-${{ hashFiles('.github/brahe-data-manifest.txt') }}
          restore-keys: |
            naif-kernels-v1-

      - name: Restore ICGEM cache
        id: icgem-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/brahe/icgem
          key: brahe-icgem-v1-${{ hashFiles('.github/brahe-data-manifest.txt') }}
          restore-keys: |
            brahe-icgem-v1-

      - name: Restore SBDB + Horizons cache
        id: sbdb-horizons-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/brahe/sbdb
            ~/.cache/brahe/horizons
          key: brahe-sbdb-horizons-v1-${{ hashFiles('.github/brahe-data-manifest.txt') }}
          restore-keys: |
            brahe-sbdb-horizons-v1-

      - name: Restore star catalog downloads
        id: star-catalogs-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/brahe/star_catalogs/FK5_Catalog.txt
            ~/.cache/brahe/star_catalogs/Hipparcos_Catalog.txt
          key: star-catalogs-v1

      - name: Restore Celestrak cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/brahe/celestrak
          key: brahe-celestrak-${{ github.run_id }}
          restore-keys: |
            brahe-celestrak-

      - name: Restore Natural Earth land basemap cache
        id: natural-earth-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/brahe/natural_earth
          key: natural-earth-50m-land-v1

      - name: Restore 3D body textures cache
        id: textures-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/brahe/textures
          key: brahe-3d-textures-v2

      - name: Restore cartopy Natural Earth data cache
        id: cartopy-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.local/share/cartopy
          key: cartopy-natural-earth-v1

      # NETWORK-flagged examples (the GCAT, ICGEM, NAIF, star-catalog,
      # Horizons, and SBDB dataset examples) are skipped by the --ci-only run
      # below, so their figures only exist in the cache saved by the weekly
      # --network integration run (test_examples.yml with use_retry). Restore
      # it first so the fresher figures generated below overwrite any
      # overlap.
      - name: Restore network example figures
        uses: actions/cache/restore@v6.1.0
        with:
          path: docs/figures/
          key: network-example-figures-
          restore-keys: |
            network-example-figures-

      # Same rationale as the figures restore above, for the captured stdout of
      # the NETWORK-flagged examples. Restored before the --ci-only run so the
      # fresher non-network outputs overwrite any overlap (the run writes
      # per-example files and never wipes docs/outputs).
      - name: Restore network example outputs
        uses: actions/cache/restore@v6.1.0
        with:
          path: docs/outputs/
          key: network-example-outputs-
          restore-keys: |
            network-example-outputs-

      - name: Pre-download plot/example resources
        env:
          BRAHE_NETWORK_MODE: online
        run: just download-resources

      - name: Save NAIF kernels cache (main only)
        if: ${{ github.ref == 'refs/heads/main' && steps.naif-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/brahe/naif
          key: naif-kernels-v1-${{ hashFiles('.github/brahe-data-manifest.txt') }}

      - name: Save ICGEM cache (main only)
        if: ${{ github.ref == 'refs/heads/main' && steps.icgem-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/brahe/icgem
          key: brahe-icgem-v1-${{ hashFiles('.github/brahe-data-manifest.txt') }}

      - name: Save SBDB + Horizons cache (main only)
        if: ${{ github.ref == 'refs/heads/main' && steps.sbdb-horizons-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cache/brahe/sbdb
            ~/.cache/brahe/horizons
          key: brahe-sbdb-horizons-v1-${{ hashFiles('.github/brahe-data-manifest.txt') }}

      - name: Save star catalog downloads (main only)
        if: ${{ github.ref == 'refs/heads/main' && steps.star-catalogs-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cache/brahe/star_catalogs/FK5_Catalog.txt
            ~/.cache/brahe/star_catalogs/Hipparcos_Catalog.txt
          key: star-catalogs-v1

      - name: Save 3D body textures cache (main only)
        if: ${{ github.ref == 'refs/heads/main' && steps.textures-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/brahe/textures
          key: brahe-3d-textures-v2

      - name: Save Natural Earth land basemap cache (main only)
        if: ${{ github.ref == 'refs/heads/main' && steps.natural-earth-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/brahe/natural_earth
          key: natural-earth-50m-land-v1

      - name: Save cartopy Natural Earth data cache (main only)
        if: ${{ github.ref == 'refs/heads/main' && steps.cartopy-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.local/share/cartopy
          key: cartopy-natural-earth-v1

      - name: Test examples (including CI-ONLY)
        run: just test-examples --ci-only

      - name: Generate documentation plots
        run: just make-plots

      - name: Upload figures as artifact
        uses: actions/upload-artifact@v7
        with:
          name: doc-figures
          path: docs/figures/
          retention-days: 7

      - name: Build documentation site
        run: uv run properdocs build

      - name: Fetch gh-pages branch
        run: git fetch origin gh-pages:gh-pages || true

      - name: Deploy documentation (latest from main)
        run: uv run --frozen mike deploy --config-file properdocs.yml --push --update-aliases latest

      - name: Set default version redirect
        run: uv run --frozen mike set-default --config-file properdocs.yml --push latest
