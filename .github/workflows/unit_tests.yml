name: Unit Tests

on:
    push:
        branches:
            - main
            - dev
        # Only run if source/test files changed
        paths:
            - 'examples/**'
            - 'plots/**'
            - 'brahe/**'
            - 'src/**'
            - 'tests/**'
            - 'test_assets/**'
            - 'data/**'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'pyproject.toml'
            - 'uv.lock'
            - '.github/workflows/unit_tests.yml'
            - '.github/workflows/test_*.yml'
            - '.github/workflows/build_latest.yml'
            - '.github/workflows/release.yml'
    # Allow manual runs to re-validate main and re-trigger the downstream
    # "Build Latest Wheels" workflow (via workflow_run) on demand.
    workflow_dispatch:

concurrency:
    group: unit-tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test-rust:
        uses: ./.github/workflows/test_rust.yml
        secrets: inherit
    delay-python:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Wait for Rust tests to claim runners
              run: sleep 15
    test-python:
        needs: [delay-python]
        uses: ./.github/workflows/test_python.yml
        with:
            os-matrix: '["ubuntu-latest", "windows-latest"]'
        secrets: inherit
    # macOS runs the supported floor and ceiling rather than every version. The
    # account allows five concurrent macOS jobs, and the full five-version
    # matrix plus the Rust and doc-test legs would exceed that on its own,
    # stalling the run before any other work competes for a runner.
    test-python-macos:
        needs: [delay-python]
        uses: ./.github/workflows/test_python.yml
        with:
            python-versions: '["3.10", "3.14"]'
            coverage-python-version: 'none'
            os-matrix: '["macos-latest"]'
        secrets: inherit
    test-examples:
        # needs: [ test-rust ] # Remove this dependency for optimistic parallel execution
        uses: ./.github/workflows/test_examples.yml
    update-docs:
        # Documentation publishes from main only; dev runs the same validation
        # without deploying.
        if: github.ref == 'refs/heads/main'
        needs: [ test-rust, test-python, test-python-macos, test-examples ]
        uses: ./.github/workflows/update_docs.yml