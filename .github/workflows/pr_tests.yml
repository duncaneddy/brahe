name: PR Tests

on:
  pull_request:
    # `labeled`/`unlabeled` are required for the `full-ci` label to take effect
    # on an already-open pull request; without them the scope is only
    # re-evaluated on the next push.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'profiles/**'

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Resolves how wide this run should be. The lean default keeps a pull
  # request inside the account's 20-job concurrency cap, which queue-starves
  # otherwise; the `full-ci` label opts a single pull request into the whole
  # integration matrix without editing anything.
  check-skip:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
      full_ci: ${{ steps.scope.outputs.full_ci }}
      rust_os: ${{ steps.scope.outputs.rust_os }}
      doc_os: ${{ steps.scope.outputs.doc_os }}
      python_scope: ${{ steps.scope.outputs.python_scope }}
      python_versions: ${{ steps.scope.outputs.python_versions }}
    steps:
      - id: skip_check
        run: |
          echo "should_skip=false" >> $GITHUB_OUTPUT
      - id: scope
        env:
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [ "$FULL" = "true" ]; then
            echo "full_ci=true" >> $GITHUB_OUTPUT
            echo 'rust_os=["ubuntu-latest", "macos-latest", "windows-latest"]' >> $GITHUB_OUTPUT
            echo 'doc_os=["ubuntu-latest", "macos-latest", "windows-latest"]' >> $GITHUB_OUTPUT
            echo "python_scope=full" >> $GITHUB_OUTPUT
            echo 'python_versions=["3.10", "3.11", "3.12", "3.13", "3.14"]' >> $GITHUB_OUTPUT
          else
            echo "full_ci=false" >> $GITHUB_OUTPUT
            echo 'rust_os=["ubuntu-latest", "macos-latest", "windows-latest"]' >> $GITHUB_OUTPUT
            # Doc tests take 51 minutes on Windows against 12 on ubuntu, so the
            # lean gate leaves them to the integration branch.
            echo 'doc_os=["ubuntu-latest", "macos-latest"]' >> $GITHUB_OUTPUT
            echo "python_scope=smoke" >> $GITHUB_OUTPUT
            # The floor declared in pyproject.toml: the version most likely to
            # break, and the one a lean gate is worth spending on.
            echo 'python_versions=["3.10"]' >> $GITHUB_OUTPUT
          fi

  test-rust:
    needs: [check-skip]
    if: needs.check-skip.outputs.should_skip == 'false'
    uses: ./.github/workflows/test_rust.yml
    with:
      os-matrix: ${{ needs.check-skip.outputs.rust_os }}
      doc-os-matrix: ${{ needs.check-skip.outputs.doc_os }}
    secrets: inherit

  delay-python:
    needs: [check-skip]
    if: needs.check-skip.outputs.should_skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for Rust tests to claim runners
        run: sleep 15

  # Pull requests test the oldest supported Python (the declared floor in
  # pyproject.toml); the full version matrix runs on the integration branch.
  test-python:
    needs: [check-skip, delay-python]
    if: needs.delay-python.result == 'success'
    uses: ./.github/workflows/test_python.yml
    with:
      python-versions: ${{ needs.check-skip.outputs.python_versions }}
      coverage-python-version: '3.10'
      os-matrix: '["ubuntu-latest", "macos-latest"]'
      python-test-scope: full
    secrets: inherit

  # Windows runs the smoke subset rather than the full suite: it is 1.8x slower
  # than ubuntu and the full run would become the critical path, while the
  # subset covers every area with a recorded history of Windows-only failures.
  test-python-windows:
    needs: [check-skip, delay-python]
    if: needs.delay-python.result == 'success'
    uses: ./.github/workflows/test_python.yml
    with:
      python-versions: ${{ needs.check-skip.outputs.python_versions }}
      coverage-python-version: 'none'
      os-matrix: '["windows-latest"]'
      python-test-scope: ${{ needs.check-skip.outputs.python_scope }}
    secrets: inherit

  test-examples:
    needs: [check-skip]
    if: needs.check-skip.outputs.should_skip == 'false'
    uses: ./.github/workflows/test_examples.yml

  # Validate crates.io package builds correctly and is under size limit.
  # Runs in parallel with test-rust (both gate only on check-skip) so the
  # package build and the test suite finish concurrently rather than serially.
  validate-rust-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [check-skip]
    if: needs.check-skip.outputs.should_skip == 'false'
    env:
      RUST_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7.0.1

      # This job only ever runs on PRs, so it never sees a main-branch save.
      # warm_data_cache.yml runs the equivalent build weekly on main under the
      # same shared-key to keep a restorable cache warm for PRs.
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-shared-key: validate-rust-package
          cache-save-if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}

      - name: Set default Rust toolchain
        run: |
          rustup update ${{ env.RUST_TOOLCHAIN }}
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Build and validate Rust package
        run: just build --lang rust

  # Validate PyPI packages build correctly with proper metadata.
  # Gated on delay-python (not test-python) so it runs in parallel with
  # test-python while still respecting the runner-claim stagger that keeps
  # Rust jobs ahead of Python jobs in the runner queue.
  validate-python-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [delay-python]
    if: needs.delay-python.result == 'success'
    env:
      RUST_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7.0.1

      # This job only ever runs on PRs, so it never sees a main-branch save.
      # warm_data_cache.yml runs the equivalent build weekly on main under the
      # same shared-key to keep a restorable cache warm for PRs.
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-shared-key: validate-python-package
          cache-save-if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}

      - name: Set default Rust toolchain
        run: |
          rustup update ${{ env.RUST_TOOLCHAIN }}
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Build and validate Python package
        run: just build --lang python

  # Build docs to verify no breakage, but don't deploy
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [check-skip, test-rust, test-python, test-examples]
    if: needs.check-skip.outputs.should_skip == 'false'
    env:
      RUST_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7.0.1

      # Shared with update_docs.yml/docs_only.yml's doc-build jobs, which both
      # run on pushes to main and so are the ones that actually save this
      # cache; this PR job only ever restores it.
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-shared-key: docs-build
          cache-save-if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}

      - name: Set default Rust toolchain
        run: |
          rustup update ${{ env.RUST_TOOLCHAIN }}
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group docs --all-extras --frozen

      - name: Build Python extension
        run: uv pip install -e ".[plots]"

      - name: Generate type stubs
        run: ./scripts/generate_stubs.sh

      # Download artifacts from test-examples
      - name: Download test-examples artifacts
        uses: actions/download-artifact@v8
        with:
          name: doc-figures
          path: docs/figures/

      - name: Build documentation (verify only, no deployment)
        run: uv run properdocs build

  # Single aggregation check to require in branch protection. Matrix job names
  # (e.g. "test-rust (ubuntu-latest, stable)") are brittle to reference directly,
  # so require only this job: it fails if any upstream job failed or was cancelled.
  # `skipped` is tolerated so path-filtered/conditional jobs don't wedge merges.
  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: always()
    # Include the gating jobs (check-skip, delay-python) so their failure is
    # caught directly. Otherwise a failed gate would only cascade into skipped
    # downstream jobs, which this check tolerates, yielding a false green.
    needs:
      - check-skip
      - test-rust
      - delay-python
      - test-python
      - test-python-windows
      - test-examples
      - validate-rust-package
      - validate-python-package
      - build-docs
    steps:
      - name: Verify all required jobs passed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Upstream job results: $results"
          for r in $results; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::A required job did not pass (result: $r)"
              exit 1
            fi
          done
          echo "All required jobs passed."
