name: Test Rust
on:
    workflow_call:
        inputs:
            network_mode:
                description: "BRAHE_NETWORK_MODE for the test steps."
                type: string
                default: "offline"
jobs:
    data-cache:
        # Restores the data families the unit suites read. When a family is
        # missing, or its cache predates the manifest, this job downloads the
        # entries once and saves them so the matrix legs below only restore.
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            -   uses: actions/checkout@v7.0.1
            -   name: Restore data caches
                timeout-minutes: 15
                id: cache
                uses: ./.github/actions/data-cache
                with:
                    families: naif
            -   name: Set up Rust toolchain
                if: steps.cache.outputs.missed != ''
                uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
                with:
                    cache-shared-key: test-python
                    cache-save-if: false
            -   name: Install uv
                if: steps.cache.outputs.missed != ''
                uses: astral-sh/setup-uv@v10.0.1
                with:
                    enable-cache: true
            -   name: Build brahe
                if: steps.cache.outputs.missed != ''
                run: |
                    uv python install 3.12
                    uv sync --group test --all-extras --frozen --python 3.12
                    uv pip install maturin --quiet
                    uv run maturin develop --uv --features pyo3/extension-module
            -   name: Warm missed families
                timeout-minutes: 15
                if: steps.cache.outputs.missed != ''
                env:
                    BRAHE_NETWORK_MODE: online
                    WARM_ARGS: ${{ steps.cache.outputs.warm-args }}
                    MISSED: ${{ steps.cache.outputs.missed }}
                run: |
                    if [ -n "$WARM_ARGS" ]; then
                        # shellcheck disable=SC2086
                        uv run --frozen python scripts/warm_data_cache.py $WARM_ARGS
                    fi
                    case " $MISSED " in
                        *" star-catalogs "*)
                            uv run --frozen python -c "import brahe as bh; bh.datasets.star_catalogs.get_fk5(); bh.datasets.star_catalogs.get_hipparcos()"
                            ;;
                    esac
            -   name: Save data caches
                # Best effort: speeds up later runs but is not what the matrix
                # legs depend on. Fork pull requests cannot write the cache.
                if: steps.cache.outputs.missed != ''
                continue-on-error: true
                uses: ./.github/actions/data-cache
                with:
                    mode: save
                    families: ${{ steps.cache.outputs.missed }}
            -   name: Hand the data to the matrix legs
                uses: actions/upload-artifact@v7
                with:
                    name: brahe-data-rust
                    path: ~/.cache/brahe/naif
                    retention-days: 1
                    if-no-files-found: error
    test-rust:
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        needs: data-cache
        strategy:
            matrix:
                # os: [ubuntu-latest]
                os: [ubuntu-latest, macos-latest, windows-latest]
                rust-toolchain: [stable]
        permissions:
            id-token: write
        env:
            CARGO_TERM_COLOR: always
            BRAHE_NETWORK_MODE: ${{ inputs.network_mode }}
        steps:
            -   uses: actions/checkout@v7.0.1
            # Cargo cache scheme: this job runs from both pr_tests.yml (PRs) and
            # unit_tests.yml (push to main). Give it a stable shared-key so PRs
            # restore main's cache regardless of matrix/job-name hashing, and
            # only let main saves refresh it — PR-scoped saves are unrestorable
            # by any other run (GitHub cache isolation) and just churn quota.
            -   name: Set up Rust toolchain with cache
                uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
                with:
                    toolchain: ${{ matrix.rust-toolchain }}
                    cache-shared-key: test-rust
                    cache-save-if: ${{ github.ref == 'refs/heads/main' }}
            -   name: Set default Rust toolchain
                run: |
                    rustup update ${{ matrix.rust-toolchain }}
                    rustup default ${{ matrix.rust-toolchain }}
            # Coverage is only uploaded from ubuntu, so only ubuntu pays for the
            # instrumented build and its slower binaries.
            -   name: Install cargo-llvm-cov
                if: matrix.os == 'ubuntu-latest'
                uses: taiki-e/install-action@cargo-llvm-cov
            -   name: Fetch the data from the data-cache job
                uses: actions/download-artifact@v8
                with:
                    name: brahe-data-rust
                    path: ~/.cache/brahe/naif
            # de440s.bsp is a committed test asset; the other kernels the unit
            # tests auto-load come from the restored NAIF cache and a miss fails
            # the test that needs them.
            -   name: Seed the DE440s test asset
                shell: bash
                run: |
                    mkdir -p ~/.cache/brahe/naif
                    cp test_assets/de440s.bsp ~/.cache/brahe/naif/
            -   name: Run Rust tests with coverage
                # Limit rust-unit coverage to the core `brahe` crate. The `brahe-py`
                # workspace member has no Rust unit tests (it's exercised by pytest),
                # so its coverage is measured in the python-rust combined flag below.
                if: matrix.os == 'ubuntu-latest'
                run: cargo llvm-cov -p brahe --lcov --output-path lcov.info
            -   name: Run Rust tests
                if: matrix.os != 'ubuntu-latest'
                run: cargo test -p brahe
            -   name: Upload coverage to Codecov
                if: matrix.os == 'ubuntu-latest'
                uses: codecov/codecov-action@v7.0.0
                env:
                    CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
                with:
                    files: lcov.info
                    flags: rust-unit
                    fail_ci_if_error: false
                    verbose: true
                    use_oidc: true
                    
            -   name: Upload Brahe cache directory (Unix)
                if: runner.os != 'Windows'
                uses: actions/upload-artifact@v7
                with:
                    name: brahe-cache-${{ runner.os }}
                    path: ~/.cache/brahe/
                    retention-days: 1
                    if-no-files-found: ignore
            -   name: Upload Brahe cache directory (Windows)
                if: runner.os == 'Windows'
                uses: actions/upload-artifact@v7
                with:
                    name: brahe-cache-${{ runner.os }}
                    path: ~\\.cache\\brahe\\
                    retention-days: 1
                    if-no-files-found: ignore
    test-rust-docs:
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        needs: data-cache
        strategy:
            matrix:
                # os: [ubuntu-latest]
                os: [ubuntu-latest, macos-latest, windows-latest]
                rust-toolchain: [stable]
        env:
            BRAHE_NETWORK_MODE: ${{ inputs.network_mode }}
        steps:
            -   uses: actions/checkout@v7.0.1
            # See "test-rust" job above for the shared-key/save-if cache scheme.
            -   name: Set up Rust toolchain with cache
                uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
                with:
                    toolchain: ${{ matrix.rust-toolchain }}
                    cache-shared-key: test-rust-docs
                    cache-save-if: ${{ github.ref == 'refs/heads/main' }}
            -   name: Set default Rust toolchain
                run: |
                    rustup update ${{ matrix.rust-toolchain }}
                    rustup default ${{ matrix.rust-toolchain }}
            -   name: Fetch the data from the data-cache job
                uses: actions/download-artifact@v8
                with:
                    name: brahe-data-rust
                    path: ~/.cache/brahe/naif
            # de440s.bsp is a committed test asset; the other kernels the unit
            # tests auto-load come from the restored NAIF cache and a miss fails
            # the test that needs them.
            -   name: Seed the DE440s test asset
                shell: bash
                run: |
                    mkdir -p ~/.cache/brahe/naif
                    cp test_assets/de440s.bsp ~/.cache/brahe/naif/
            -   name: Run Rust doc tests
                run: cargo test --doc
    